name: Deploy to Amazon EC2 (Tomcat)

on:
  push:
    branches: [ "main" ]  # mainブランチにpushされたら自動起動

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}          # AWS_EC2_HOST から HOST に変更
        username: ${{ secrets.USER_NAME }}  # AWS_EC2_USER から USER_NAME に変更
        key: ${{ secrets.SSH_KEY }}        # AWS_SSH_KEY から SSH_KEY に変更
        port: 22
        script: |
          # 1. 自分のホームディレクトリ等、一時的な作業場所に移動して pull する
          cd /home/ubuntu
          
          # もし作業フォルダがなければ初回だけ落とす（すでにある場合は cd scoremanagergit）
          if [ ! -d "scoremanagergit" ]; then
            git clone git@github.com:${{ secrets.USER_NAME }}/scoremanagergit.git
          fi
          cd scoremanagergit
          git pull origin main
          
          # 2. 余計な外箱（scoremanager/scoremanager）の中身だけを、本番の score フォルダへ根こそぎコピー！
          # ★ここのパスを実際のGitHubのフォルダ構造に合わせます
          sudo cp -r scoremanager/scoremanager/* /opt/tomcat10/webapps/score/
          
          # 3. 古いTomcatの作業キャッシュを削除して再起動
          sudo rm -rf /opt/tomcat10/work/Catalina/localhost/score
          sudo /opt/tomcat10/bin/shutdown.sh
          sudo /opt/tomcat10/bin/startup.sh
