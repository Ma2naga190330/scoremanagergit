name: Deploy to Amazon EC2 (Tomcat)

on:
  push:
    branches: [ "main" ]  # mainブランチにpushされたら自動起動

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}          # AWS_EC2_HOST から HOST に変更
        username: ${{ secrets.USER_NAME }}  # AWS_EC2_USER から USER_NAME に変更
        key: ${{ secrets.SSH_KEY }}        # AWS_SSH_KEY から SSH_KEY に変更
        port: 22
        script: |
          # 1. 一時作業フォルダをクリーンアップして最新コードをクローン
          rm -rf /home/ubuntu/score_temp
          mkdir -p /home/ubuntu/score_temp
          cd /home/ubuntu/score_temp
          git clone --depth 1 git@github.com:${{ secrets.USER_NAME }}/scoremanagergit.git .
          
          # 2. 本物のWebコンテンツ（webapp直下）を、空にした本番フォルダへ根こそぎコピー
          # ★これで、scoremanager/ 階層を挟まずに index.jsp や WEB-INF が配置されます
          sudo cp -r score/src/main/webapp/* /opt/tomcat10/webapps/score/
          
          # 3. サーバー側にある最新の Dao.java を強制的にコンパイルする（直撃ビルド）
          sudo javac -cp "/opt/tomcat10/lib/*:/opt/tomcat10/webapps/score/WEB-INF/classes" -d /opt/tomcat10/webapps/score/WEB-INF/classes /opt/tomcat10/webapps/score/WEB-INF/classes/dao/Dao.java
          
          # 4. Tomcatを綺麗な状態で起動する
          sudo rm -rf /opt/tomcat10/work/Catalina/localhost/score
          sudo /opt/tomcat10/bin/startup.sh
          sudo /opt/tomcat10/bin/startup.sh
