name: Deploy to Amazon EC2 (Tomcat)

on:
  push:
    branches: [ "main" ]

# 🚀 トークンエラーを回避するために設定を拡張
permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER_NAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          # 1. 衝突して気絶しているTomcatを完全に強制終了してリセット
          sudo killall -9 java || true
          sudo /opt/tomcat10/bin/shutdown.sh || true
          
          # 2. 一時作業フォルダをクリーンアップ
          rm -rf /home/ubuntu/score_temp
          mkdir -p /home/ubuntu/score_temp
          cd /home/ubuntu/score_temp
          
          # 🚀 【修正】あなたのユーザー名を使って、HTTPS経由で確実にクローンを成功させます
          git clone --depth 1 https://github.com/${{ secrets.USER_NAME }}/scoremanagergit.git .
          
          # 3. 本物のWebコンテンツ（webapp直下）を、本番フォルダへ根こそぎコピー
          sudo cp -r score/src/main/webapp/* /opt/tomcat10/webapps/score/
          
          # 4. サーバー側にある最新の Dao.java をコンパイル
          if [ -f "/opt/tomcat10/webapps/score/WEB-INF/classes/dao/Dao.java" ]; then
            sudo javac -cp "/opt/tomcat10/lib/*:/opt/tomcat10/webapps/score/WEB-INF/classes" -d /opt/tomcat10/webapps/score/WEB-INF/classes /opt/tomcat10/webapps/score/WEB-INF/classes/dao/Dao.java
          fi
          
          # 5. Tomcatのキャッシュを消去し、1回だけ綺麗に起動する（多重起動を防止）
          sudo rm -rf /opt/tomcat10/work/Catalina/localhost/score
          sudo /opt/tomcat10/bin/startup.sh
