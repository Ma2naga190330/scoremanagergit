name: Deploy to Amazon EC2 (Tomcat)

on:
  push:
    branches: [ "main" ]  # mainブランチにpushされたら自動起動

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}          # AWS_EC2_HOST から HOST に変更
        username: ${{ secrets.USER_NAME }}  # AWS_EC2_USER から USER_NAME に変更
        key: ${{ secrets.SSH_KEY }}        # AWS_SSH_KEY から SSH_KEY に変更
        port: 22
        script: |
          # 1. サーバー上の古い一時作業フォルダを完全に削除してリセット
          rm -rf /home/ubuntu/score_temp
          mkdir -p /home/ubuntu/score_temp
          cd /home/ubuntu/score_temp
          
          # 2. GitHubから最新のコードを完全に真っ新な状態でクローンする
          # ★リポジトリ名が「scoremanagergit」であることを前提にしています
          git clone --depth 1 git@github.com:${{ secrets.USER_NAME }}/scoremanagergit.git .
          
          # 3. 二重フォルダの奥底にある「本物のJSPやWEB-INF」だけを本番フォルダへ強制上書きコピー
          sudo cp -r scoremanager/scoremanager/* /opt/tomcat10/webapps/score/
          
          # 4. Tomcatの作業キャッシュを確実に削除して再起動
          sudo rm -rf /opt/tomcat10/work/Catalina/localhost/score
          sudo /opt/tomcat10/bin/shutdown.sh
          sudo /opt/tomcat10/bin/startup.sh
